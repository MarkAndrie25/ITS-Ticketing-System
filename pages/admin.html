<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="../style/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <header class="Lside-part">
        <div class="lblprofile">
            <img src="../images/user.jpg" alt="profile" class="profile">
            <h2>Mark Andrie Dela Cruz</h2>
            <p>ITS Intern</p>
        </div>

        <nav class="side-navbar">
            <button class="addUser">Dashboard</button>
            <button class="addUser">Add User</button>
            <button class="addUser">Add User</button>
        </nav>
    </header>

    <main class="right-side">
    <div class="reg-frm-container">

        <h1>Add new User</h1>

        <form>

            <!-- ROW: First & Last Name -->
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" class="user-name">
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" class="user-name">
                </div>
            </div>

            <!-- COLUMN INPUTS -->
            <div class="form-column">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password">
                </div>

                <div class="form-group">
                    <label>Role</label>
                    <input type="text">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit">Add User</button>
            </div>

        </form>


    </div>
</main>

</body>
</html>

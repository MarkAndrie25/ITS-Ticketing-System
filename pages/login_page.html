<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="../style/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    
        <div class="left-side">
            <h1>ITS Ticketing System</h1>
        </div>

        <div class="right-side">

            <div class="container-form">
                <h1>Welcome Users</h1>
            
                <form action="" class="form-login">
                    <label for="">Email</label><br>
                    <input type="text" class="email" id="email" placeholder="example@gmail.com"><br>

                    <label for="">Password</label><br>
                    <input type="password" class="password" id="password" >

                    <button class="log-in">Log in</button>
                    <p>Don't have an account? create <a href="" id="link-reg">here!</a></p>
                </form>
            </div>
        </div>

        <div class="registration-form">
    <h1>Registration Form</h1>

    <form>
        <div class="row">
            <div class="field">
                <label>First Name</label>
                <input type="text" placeholder="First Name">
            </div>

            <div class="field">
                <label>Last Name</label>
                <input type="text" placeholder="Last Name">
            </div>
        </div>

        <div class="field">
            <label>Company</label>
            <input type="text" placeholder="ITS Department">
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" placeholder="example@gmail.com">
        </div>

        <div class="field">
            <label>Password</label>
            <input type="password">
        </div>

        <div class="row">
            <button class="reg">Register</button>
            <button class="reg-log">Log in</button>
        </div>

    </form>
</div>

   
<script src="../Script/login.js"></script>
</body>
</html>
